[package]
name = "hackathon-mentor-dispatch-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", features = ["serde"] }
subtle = "=2.6.1"
fs2 = "=0.4.3"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
